<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Admin Dashboard-Complaint Tracker</title>
        <link rel="Stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Admin Dashboard</h1>
            <p class="subtitle">
                Manage and track college complaints</p>
            <h2>All Complaints</h2>
            <div class="complaints-table-container">
            <table id="complaintsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="complaintsTableBody">
                </tbody>
            </table>
        </div>
        <script src="dashboard.js"></script>
    </body>
</html>
